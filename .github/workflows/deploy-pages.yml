name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: override the API Gateway URL with a repo variable (Settings > Variables > AWS_SNS_ENDPOINT)
      - name: Configure AWS endpoint
        if: ${{ vars.AWS_SNS_ENDPOINT != '' }}
        run: |
          sed -i "s|^window.AWS_SNS_ENDPOINT = .*|window.AWS_SNS_ENDPOINT = \"${{ vars.AWS_SNS_ENDPOINT }}\";|" js/aws-config.js
          cat js/aws-config.js

      - name: Assemble static site
        run: |
          mkdir _site
          cp -r index.html aws-monitor.html .nojekyll css js student admin _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
