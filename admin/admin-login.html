<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Login - CampusEats</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="card login-container">
        <h2 style="text-align: center; margin-bottom: 20px;">Partner Login</h2>
        <div id="errorMsg" class="alert hidden"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Shop ID</label>
                <input type="text" id="shopId" placeholder="Enter your Shop ID" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="adminLoginBtn" class="btn btn-secondary" style="width: 100%;">Access Dashboard</button>
        </form>

        <p style="text-align: center; margin-top: 15px;">
            <a href="../index.html" style="font-size: 0.9rem; color: #666;">Back to Home</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0"></script>
    <script src="../js/appwrite.js"></script>
    <script src="../js/appwrite-auth.js"></script>
    <script src="../js/appwrite-db.js"></script>
    <script>
        // Check if already logged in
        const admin = AppwriteAuth.getCurrentAdmin();
        if (admin) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const shopId = document.getElementById('shopId').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('adminLoginBtn');

            errorMsg.classList.add('hidden');

            btn.dataset.originalText = btn.textContent;
            btn.innerHTML = '<span class="loading-spinner"></span> Logging in...';
            btn.disabled = true;

            const result = await AppwriteAuth.loginAdmin(shopId, password);

            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.textContent = result.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = btn.dataset.originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
