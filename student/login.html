<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - CampusEats</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/student.css">
    <style>
        .auth-tabs {
            display: flex;
            margin-bottom: var(--space-8);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 2px solid var(--primary-color, #e74c3c);
        }

        .auth-tab {
            flex: 1;
            padding: var(--space-3) var(--space-4);
            text-align: center;
            cursor: pointer;
            font-weight: var(--weight-semibold);
            font-size: var(--text-base);
            transition: all 0.3s ease;
            background: transparent;
            color: var(--primary-color, #e74c3c);
            border: none;
        }

        .auth-tab.active {
            background: var(--primary-color, #e74c3c);
            color: white;
        }

        .auth-tab:hover:not(.active) {
            background: rgba(231, 76, 60, 0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="auth-container fade-in">
        <a href="../index.html" class="btn-back"
            style="position: absolute; top: 20px; left: 20px; border: none; box-shadow: var(--shadow-md);">←</a>
        <div class="auth-header">
            <h2>Welcome! 🎓</h2>
            <p>Login or sign up to order your favorite campus food</p>
        </div>

        <div id="errorMsg" class="alert alert-error hidden"></div>
        <div id="successMsg" class="alert hidden" style="background: #d4edda; color: #155724; padding: 12px; border-radius: 8px;"></div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Login</button>
            <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="loginTab" class="tab-content active">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">VIT Email</label>
                    <input type="email" id="loginEmail" class="input-modern" placeholder="email@vitstudent.ac.in"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="input-modern" placeholder="Enter your password"
                        minlength="8" required>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary btn-large" style="width: 100%;">
                    Login →
                </button>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signupTab" class="tab-content">
            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="signupRegNo">Registration Number</label>
                    <input type="text" id="signupRegNo" class="input-modern" placeholder="e.g. 21BCE1234" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupEmail">VIT Email</label>
                    <input type="email" id="signupEmail" class="input-modern" placeholder="email@vitstudent.ac.in"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" class="input-modern" placeholder="Min 8 characters"
                        minlength="8" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupConfirm">Confirm Password</label>
                    <input type="password" id="signupConfirm" class="input-modern" placeholder="Re-enter password"
                        minlength="8" required>
                </div>

                <button type="submit" id="signupBtn" class="btn btn-primary btn-large" style="width: 100%;">
                    Create Account →
                </button>
            </form>
        </div>

        <p style="margin-top: var(--space-6); text-align: center; font-size: var(--text-sm);">
            <a href="../index.html" class="text-muted">← Back to Home</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0"></script>
    <script src="../js/appwrite.js"></script>
    <script src="../js/appwrite-auth.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
