<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - CampusEats</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/student.css">
</head>

<body>

    <header class="header">
        <div class="container navbar">
            <div style="display: flex; align-items: center;">
                <a href="#" onclick="history.back()" class="btn-back">←</a>
                <div class="logo">CampusEats</div>
            </div>
            <div class="nav-links">
                <a href="cart.html" class="btn btn-primary">
                    🛒 Cart <span id="cartBadge" class="badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div style="margin: var(--space-8) 0 var(--space-6);">
            <h2 id="shopName" style="margin-bottom: var(--space-2);">Loading...</h2>
            <p class="text-muted">Browse our delicious menu</p>
        </div>

        <div id="menuContainer" class="menu-grid fade-in">
            <!-- Menu Items Injected via JS -->
        </div>

        <div style="text-align: center; margin: var(--space-12) 0;">
            <a href="cart.html" class="btn btn-primary btn-large">
                View Cart & Checkout →
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0"></script>
    <script src="../js/appwrite.js"></script>
    <script src="../js/appwrite-auth.js"></script>
    <script src="../js/appwrite-db.js"></script>
    <script src="../js/menu.js"></script>
</body>

</html>
